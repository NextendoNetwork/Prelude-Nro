name: Build NRO

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Only what the link line actually uses (see LIBS in the Makefile):
          # libmpg123 and freetype2. switch-sdl2 / switch-sdl2_mixer were left
          # over from before build 52 dropped SDL2 - never linked, but still
          # able to fail the whole job when they move upstream.
          dkp-pacman -Syu --noconfirm --needed \
            switch-freetype \
            switch-mpg123

      - name: Build
        run: make -j$(nproc)

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          # NOT github.ref_name: on a pull_request it expands to "<pr>/merge", and
          # upload-artifact@v4 rejects any name containing a slash. run_id is always valid.
          name: nextendo-${{ github.run_id }}
          path: nextendo.nro
          if-no-files-found: error

      - name: Tag must match APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mk=$(sed -n 's/^APP_VERSION[[:space:]]*:=[[:space:]]*//p' Makefile)
          [ "$mk" = "${GITHUB_REF_NAME#v}" ] || { echo "Makefile=$mk tag=${GITHUB_REF_NAME#v}"; exit 1; }

      - name: Upload NRO to release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nextendo.nro
          generate_release_notes: true
